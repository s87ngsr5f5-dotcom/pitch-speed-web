name: SmartScoutPro
options:
  bundleIdPrefix: com.smartscout.baseball
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

targets:
  SmartScoutPro:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SmartScoutPro
        excludes:
          - "Models/*.pt"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartscout.baseball.pro
        PRODUCT_NAME: SmartScoutPro
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "SmartScout AI"
        INFOPLIST_KEY_NSCameraUsageDescription: "需要相機權限以 60fps 追蹤棒球飛行軌跡並計算球速與變化量。"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "需要相簿寫入權限，才能將每一球自動錄製的影片存進 iPhone 相簿。"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "需要相簿讀取權限，以匯入您先前錄製的 60/120fps 投球影片進行測速分析。"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIStatusBarStyle: "UIStatusBarStyleLightContent"
