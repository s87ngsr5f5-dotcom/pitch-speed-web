name: Build iPhone Native App (.ipa + CoreML)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios-app/**"
      - ".github/workflows/build-ios-ipa.yml"

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python for CoreML export
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install xcodegen and CoreML conversion tools
        run: |
          brew install xcodegen
          pip install --upgrade pip
          pip install "torch==2.5.1" "torchvision==0.20.1" "numpy<2" "coremltools==8.2" "ultralytics>=8.3.0"

      - name: Convert YOLO11s (640px) and YOLO11n (320px) to Apple Neural Engine CoreML (.mlpackage)
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          import shutil
          from ultralytics import YOLO

          exports = [
              ("ios-app/SmartScoutPro/Models/ball_yolo11s_640.pt", 640, "ios-app/SmartScoutPro/Models/BaseballDetector640.mlpackage"),
              ("ios-app/SmartScoutPro/Models/ball_yolo11n.pt", 320, "ios-app/SmartScoutPro/Models/BaseballDetector.mlpackage"),
          ]

          for src_str, imgsz, dst_str in exports:
              pt_path = Path(src_str)
              if not pt_path.exists():
                  raise FileNotFoundError(f"Missing {pt_path}")
              model = YOLO(str(pt_path))
              exported = Path(model.export(format="coreml", imgsz=imgsz, nms=False))
              print(f"Exported {src_str} @ {imgsz}px -> {exported} (exists={exported.exists()})")
              dst = Path(dst_str)
              if dst.exists():
                  shutil.rmtree(dst)
              shutil.move(str(exported), str(dst))
              print("Installed CoreML package:", dst)
          EOF

      - name: Generate Xcode project with XcodeGen
        working-directory: ios-app
        run: xcodegen generate

      - name: Build unsigned arm64 iOS app (.app)
        working-directory: ios-app
        run: |
          xcodebuild \
            -project SmartScoutPro.xcodeproj \
            -scheme SmartScoutPro \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package SmartScoutPro-unsigned.ipa
        working-directory: ios-app
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/SmartScoutPro.app build/ipa/Payload/
          cd build/ipa
          zip -r ../SmartScoutPro-unsigned.ipa Payload

      - name: Upload SmartScoutPro-unsigned.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartScoutPro-iPhone-IPA
          path: ios-app/build/SmartScoutPro-unsigned.ipa
          retention-days: 30
